<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Slideshow</title>
<style>
body { margin:0; padding:0; }
.slideshow {
    position: relative;
    max-width: 100%;
    margin: auto;
    overflow: hidden;
}
.slideshow img {
    width: 100%;
    height: auto;
    display: none;
}
.slideshow img.active {
    display: block;
}
.slideshow-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 10px;
    cursor: pointer;
    font-size: 18px;
    z-index: 10;
}
.slideshow-btn.prev { left: 0; }
.slideshow-btn.next { right: 0; }
.slideshow figcaption {
    text-align: right;
    font-size: 0.9em;
    color: #555;
    margin-top: 5px;
}
</style>
</head>
<body>

<div id="slideshow-container"></div>

<script>
// 解析 URL 参数
function getQueryParams() {
    const params = {};
    location.search.substring(1).split("&").forEach(pair => {
        let [key, value] = pair.split("=");
        if (key) params[decodeURIComponent(key)] = decodeURIComponent(value || "");
    });
    return params;
}

function createSlideshow(containerId, { images, caption }) {
    const container = document.getElementById(containerId);
    const figure = document.createElement("figure");
    figure.className = "slideshow";

    images.forEach((src, index) => {
        const img = document.createElement("img");
        img.src = src;
        img.alt = `Slide ${index+1}`;
        if (index === 0) img.classList.add("active");
        figure.appendChild(img);

        // 图片加载完后自适应 iframe 高度
        img.onload = adjustIframeHeight;
    });

    const prevBtn = document.createElement("button");
    prevBtn.className = "slideshow-btn prev";
    prevBtn.innerHTML = "&#10094;";

    const nextBtn = document.createElement("button");
    nextBtn.className = "slideshow-btn next";
    nextBtn.innerHTML = "&#10095;";

    figure.appendChild(prevBtn);
    figure.appendChild(nextBtn);

    if (caption) {
        const figcaption = document.createElement("figcaption");
        figcaption.innerHTML = caption;
        figure.appendChild(figcaption);
    }

    container.appendChild(figure);

    const slides = figure.querySelectorAll("img");
    let current = 0;

    function showSlide(index) {
        slides.forEach((img, i) => img.classList.toggle("active", i === index));
        adjustIframeHeight();
    }

    prevBtn.addEventListener("click", () => {
        current = (current - 1 + slides.length) % slides.length;
        showSlide(current);
    });

    nextBtn.addEventListener("click", () => {
        current = (current + 1) % slides.length;
        showSlide(current);
    });

    // 自动调整 iframe 高度
    function adjustIframeHeight() {
        if (window.parent && window.parent !== window) {
            const iframe = [...window.parent.document.getElementsByTagName("iframe")]
                .find(f => f.contentWindow === window);
            if (iframe) {
                iframe.style.height = document.body.scrollHeight + "px";
            }
        }
    }

    adjustIframeHeight(); // 初始化高度
}

// 初始化
const q = getQueryParams();
const images = q.imgs ? q.imgs.split(",") : [];
const caption = q.caption || "";
createSlideshow("slideshow-container", { images, caption });
</script>

</body>
</html>
